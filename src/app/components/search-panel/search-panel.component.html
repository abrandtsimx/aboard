<aside class="search" [class.search--curating]="editorUi.curatingItems()">
  @if (editorUi.curatingItems()) {
    <div class="search__curate-bar">
      <span class="search__curate-label text-caption">Curating items</span>
      <button
        type="button"
        class="search__new-item"
        [class.search__new-item--active]="isCuratingNewItem()"
        (click)="editorUi.requestNewItem()"
      >
        New item
      </button>
    </div>
  }

  <div class="search__field">
    <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"
      />
    </svg>
    <input
      type="search"
      class="search__input"
      placeholder="Search items…"
      [value]="query()"
      (input)="onQuery($any($event.target).value)"
      aria-label="Search items"
    />
    @if (query()) {
      <button type="button" class="search__clear" (click)="clearQuery()" aria-label="Clear search">×</button>
    }
  </div>

  <div class="search__results">
    <button
      type="button"
      class="search__home"
      [class.search__home--active]="isRootActive()"
      (click)="goHome()"
      [title]="boardTitle()"
    >
      <span class="search__home-icon" aria-hidden="true">⌂</span>
      <span class="search__home-label">{{ boardTitle() }}</span>
    </button>

    @for (group of groups(); track group.typeKey) {
      <section class="group">
        <button
          type="button"
          class="group__header"
          (click)="toggle(group.typeKey)"
          [attr.aria-expanded]="!isCollapsed(group.typeKey)"
        >
          <span class="group__caret" [class.group__caret--open]="!isCollapsed(group.typeKey)">▸</span>
          <span class="group__title">{{ group.label }}</span>
          <span class="group__count">{{ group.nodes.length }}</span>
        </button>

        @if (!isCollapsed(group.typeKey)) {
          <ul class="group__list">
            @for (node of group.nodes; track node.id) {
              <li>
                <button
                  type="button"
                  class="item"
                  [class.item--active]="isActive(node)"
                  (click)="select(node)"
                  [title]="node.description || node.label"
                >
                  <span
                    class="item__marker"
                    [class]="markerClass(group.typeKey)"
                    [style.background]="markerColor(node) ?? null"
                  ></span>
                  <span class="item__label">{{ node.label }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </section>
    }

    @if (totalCount() === 0 && query()) {
      <p class="search__empty">No items match “{{ query() }}”.</p>
    }
  </div>
</aside>
