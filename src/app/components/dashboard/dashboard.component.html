<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__brand">
      <h1 class="text-big-headline">Aboard</h1>
      <p class="dashboard__tagline text-copy">Your boards — stored locally in this browser</p>
    </div>

    <div class="dashboard__actions">
      <button type="button" class="btn btn--secondary" (click)="createBlankBoard()">New board</button>
      <select
        class="btn btn--secondary"
        (change)="loadExample($event)"
        aria-label="Add example board"
      >
        <option value="" selected>Add example…</option>
        @for (example of examples; track example.path) {
          <option [value]="example.path">{{ example.label }}</option>
        }
      </select>
      <label class="btn btn--primary">
        Import board
        <input type="file" accept=".board,.json,application/json" hidden (change)="onImport($event)" />
      </label>
    </div>
  </header>

  @if (library.library().length === 0) {
    <div class="dashboard__empty">
      <p class="text-headline-copy">No boards yet</p>
      <p class="text-copy">Import a .board file or add an example to get started.</p>
    </div>
  } @else {
    <div class="dashboard__bulk">
      <label class="dashboard__select-all text-caption">
        <input
          type="checkbox"
          [checked]="allBoardsSelected()"
          (change)="toggleAllBoards($event)"
        />
        Select all
      </label>
      <button
        type="button"
        class="btn btn--danger"
        [disabled]="selectedCount() === 0"
        (click)="deleteSelectedBoards()"
      >
        Delete selected@if (selectedCount() > 0) { ({{ selectedCount() }}) }
      </button>
    </div>

    <div class="dashboard__grid">
      @for (board of library.library(); track board.id) {
        <article class="board-card" [class.board-card--selected]="selectedBoardIds().has(board.id)">
          <label class="board-card__select" (click)="$event.stopPropagation()">
            <input
              type="checkbox"
              [checked]="selectedBoardIds().has(board.id)"
              (change)="toggleBoardSelection($event, board.id)"
              [attr.aria-label]="'Select ' + board.title"
            />
          </label>
          <button type="button" class="board-card__open" (click)="openBoard(board)">
            <span class="board-card__title">{{ board.title }}</span>
            <span class="board-card__meta text-caption">
              {{ board.nodeCount }} nodes · Updated {{ formatDate(board.updatedAt) }}
            </span>
          </button>
          <button
            type="button"
            class="board-card__delete"
            aria-label="Remove board"
            title="Remove from library"
            (click)="deleteBoard($event, board.id)"
          >
            ×
          </button>
        </article>
      }
    </div>
  }
</div>
